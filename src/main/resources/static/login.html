<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Guardería Canina</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="landing-header">
    <div class="landing-container landing-nav">
        <a href="index.html" class="landing-logo">
            <span class="landing-logo-icon">🐶</span>
            <span>Guardería Canina</span>
        </a>

        <nav class="landing-menu">
            <a href="index.html">Inicio</a>
            <a href="registro.html" class="btn btn-primary">Registrarse</a>
        </nav>
    </div>
</header>

<main class="auth-wrapper">
    <section class="auth-card">

        <div class="auth-header">
            <h1>Iniciar sesión</h1>
            <p>Accede a tu panel de cliente o administración</p>
        </div>

        <form id="loginForm" class="auth-form">

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary submit-btn">
                Iniciar sesión
            </button>

        </form>

        <div id="mensaje" class="mensaje-login"></div>

        <div class="auth-links">
            <button type="button" id="btnRecuperarPassword" class="link-button">
                ¿Olvidaste tu contraseña?
            </button>
        </div>

        <div class="auth-footer">
            <p>¿No tienes cuenta?</p>
            <a href="registro.html">Crear cuenta</a>
        </div>

    </section>
</main>

<footer class="landing-footer">
    <div class="landing-container footer-grid">
        <div>
            <strong>🐶 Guardería Canina</strong>
            <p>Acceso seguro al sistema de reservas</p>
        </div>
    </div>
</footer>

<script src="js/login.js"></script>
</body>
</html>
