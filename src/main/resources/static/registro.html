<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Guardería Canina</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="landing-header">
    <div class="landing-container landing-nav">
        <a href="index.html" class="landing-logo">
            <span class="landing-logo-icon">🐶</span>
            <span>Guardería Canina</span>
        </a>

        <nav class="landing-menu">
            <a href="index.html">Inicio</a>
            <a href="login.html" class="btn btn-primary">Iniciar sesión</a>
        </nav>
    </div>
</header>

<main class="auth-wrapper">
    <section class="auth-card">

        <div class="auth-header">
            <h1>Crear cuenta</h1>
            <p>Regístrate para gestionar tus mascotas y reservas</p>
        </div>

        <form id="registroForm" class="auth-form">

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <button type="submit" class="btn btn-primary submit-btn">
                Crear cuenta
            </button>

        </form>

        <div id="mensaje" class="mensaje-registro"></div>

        <div class="auth-footer">
            <p>¿Ya tienes cuenta?</p>
            <a href="login.html">Iniciar sesión</a>
        </div>

    </section>
</main>

<footer class="landing-footer">
    <div class="landing-container footer-grid">
        <div>
            <strong>🐶 Guardería Canina</strong>
            <p>Registro de clientes para el sistema de reservas</p>
        </div>
    </div>
</footer>

<script src="js/registro.js"></script>
</body>
</html>
